<text x="44" y="224" class="mono" font-size="14" xml:space="preserve" clip-path="url(#c1)"><tspan fill="#FD8F3F">▸ </tspan><tspan fill="#FC5FA3" font-weight="700">Compiling </tspan><tspan fill="#DFDFE0">Swift 6 · SwiftUI · UIKit · Combine · async/await</tspan></text>
<text x="44" y="254" class="mono" font-size="14" xml:space="preserve" clip-path="url(#c2)"><tspan fill="#FD8F3F">▸ </tspan><tspan fill="#FC5FA3" font-weight="700">Linking   </tspan><tspan fill="#DFDFE0">Clean Architecture · MVVM · VIP · VIPER · SPM</tspan></text>
<text x="44" y="284" class="mono" font-size="14" xml:space="preserve" clip-path="url(#c3)"><tspan fill="#FD8F3F">▸ </tspan><tspan fill="#FC5FA3" font-weight="700">Securing  </tspan><tspan fill="#DFDFE0">E2EE (CryptoKit) · Keychain · SSL pinning</tspan></text>
<text x="44" y="314" class="mono" font-size="14" xml:space="preserve" clip-path="url(#c4)"><tspan fill="#FD8F3F">▸ </tspan><tspan fill="#FC5FA3" font-weight="700">Wiring    </tspan><tspan fill="#DFDFE0">Apple Pay · Mada · Nafath · SignalR · WebRTC</tspan></text>
<text x="44" y="344" class="mono" font-size="14" xml:space="preserve" clip-path="url(#c5)"><tspan fill="#FD8F3F">▸ </tspan><tspan fill="#FC5FA3" font-weight="700">Testing   </tspan><tspan fill="#DFDFE0">XCTest · XCUITest · 8+ years in production</tspan></text>
<text x="44" y="374" class="mono" font-size="14" xml:space="preserve" clip-path="url(#c6)"><tspan fill="#FD8F3F">▸ </tspan><tspan fill="#FC5FA3" font-weight="700">Shipping  </tspan><tspan fill="#DFDFE0">Fastlane → App Store · KSA · Iraq · Egypt</tspan></text>
<text x="44" y="404" class="mono" font-size="14" xml:space="preserve" clip-path="url(#c7)"><tspan fill="#32D74B" font-weight="700">** BUILD SUCCEEDED ** </tspan><tspan fill="#DFDFE0">Senior iOS Developer, leading 4 engineers </tspan><tspan fill="#DFDFE0">▋<animate attributeName="fill-opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
